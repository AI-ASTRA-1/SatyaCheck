<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Acquisition Test Client</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      background: #f9fafb;
      color: #1f2937;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { margin-top: 0; color: #4b5563; }
    .controls { margin: 20px 0; display: flex; gap: 10px; }
    button {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-start { background: #2563eb; color: white; }
    .btn-start:hover { background: #1d4ed8; }
    .btn-stop { background: #dc2626; color: white; }
    .btn-stop:hover { background: #b91c1c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log-box {
      background: #111827;
      color: #10b981;
      font-family: monospace;
      padding: 12px;
      border-radius: 6px;
      height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #e5e7eb;
      color: #374151;
    }
    .status-active { background: #d1fae5; color: #065f46; }
  </style>
</head>
<body>
  <h1>WebRTC Audio Acquisition Client</h1>
  <p>Stream live microphone audio to the Signalling Server (<code>ws://localhost:8766</code>).</p>

  <div>
    Status: <span id="statusBadge" class="status-badge">Idle</span>
  </div>

  <div class="controls">
    <button id="startBtn" class="btn-start" onclick="startCall()">Start Streaming</button>
    <button id="stopBtn" class="btn-stop" onclick="stopCall()" disabled>Stop Streaming</button>
  </div>

  <div class="log-box" id="logBox"></div>

  <script>
    let ws = null;
    let pc = null;
    let localStream = null;

    function log(text) {
      const box = document.getElementById("logBox");
      const time = new Date().toLocaleTimeString();
      box.innerHTML += `[${time}] ${text}<br/>`;
      box.scrollTop = box.scrollHeight;
    }

    function setStatus(text, isActive = false) {
      const badge = document.getElementById("statusBadge");
      badge.innerText = text;
      badge.className = "status-badge" + (isActive ? " status-active" : "");
    }

    async function startCall() {
      try {
        setStatus("Connecting to signalling...");
        log("Opening WebSocket to ws://localhost:8766...");
        ws = new WebSocket("ws://localhost:8766");

        ws.onopen = async () => {
          log("WebSocket connected. Requesting microphone access...");
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          log("Microphone acquired. Creating WebRTC PeerConnection...");

          pc = new RTCPeerConnection();

          localStream.getTracks().forEach(track => {
            pc.addTrack(track, localStream);
            log("Added audio track to PeerConnection.");
          });

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              ws.send(JSON.stringify({ type: "ice", candidate: event.candidate }));
            }
          };

          pc.onconnectionstatechange = () => {
            log(`PeerConnection state: ${pc.connectionState}`);
            if (pc.connectionState === "connected") {
              setStatus("Streaming Audio", true);
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          const callId = "call_" + Math.random().toString(36).substring(2, 9);
          log(`Sending SDP offer for ${callId}...`);
          ws.send(JSON.stringify({
            type: "offer",
            call_id: callId,
            sdp: offer.sdp
          }));
        };

        ws.onmessage = async (event) => {
          const data = JSON.parse(event.data);
          if (data.type === "session_id") {
            log(`Assigned stream_id: ${data.stream_id} (call_id: ${data.call_id})`);
          } else if (data.type === "answer") {
            log("Received SDP answer from server. Applying remote description...");
            await pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: data.sdp }));
            log("Remote description set successfully.");
            document.getElementById("startBtn").disabled = true;
            document.getElementById("stopBtn").disabled = false;
          } else if (data.type === "error") {
            log(`Server error: ${data.reason}`);
            stopCall();
          }
        };

        ws.onerror = (err) => {
          log("WebSocket error: " + err);
          stopCall();
        };

        ws.onclose = () => {
          log("WebSocket connection closed.");
          setStatus("Disconnected");
          document.getElementById("startBtn").disabled = false;
          document.getElementById("stopBtn").disabled = true;
        };

      } catch (err) {
        log("Error: " + err.message);
        setStatus("Error");
        stopCall();
      }
    }

    function stopCall() {
      if (pc) {
        pc.close();
        pc = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      log("Streaming stopped.");
      setStatus("Stopped");
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
    }
  </script>
</body>
</html>
