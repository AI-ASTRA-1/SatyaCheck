apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Wire up expo-modules-core plugin helpers when building inside the app.
def expoModulesCorePlugin = new File(
    project(':expo-modules-core').projectDir.absolutePath,
    "ExpoModulesCorePlugin.gradle"
)
if (expoModulesCorePlugin.exists()) {
    apply from: expoModulesCorePlugin
    applyKotlinExpoModulesCorePlugin()
}

group = 'com.aiastra.satyacheckoverlay'
version = '1.0.0'

android {
    compileSdkVersion safeExtGet("compileSdkVersion", 34)
    namespace "com.aiastra.satyacheckoverlay"

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.majorVersion
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kotlinVersion()}"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def kotlinVersion() {
    rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "1.9.24"
}
